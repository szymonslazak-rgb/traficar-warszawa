    return new Date(n * MS).toLocaleDateString("pl-PL", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
  }
  function shortDay(n) { var d = new Date(n * MS); return d.getUTCDate() + "." + String(d.getUTCMonth() + 1).padStart(2, "0"); }

  function clamp(from, to) {
    var todayN = num(D.today), f = num(from), t = Math.min(num(to), todayN);
    if (f > t) f = t;
    if (t - f + 1 > 366) f = t - 365;
    if (startN !== null && f < startN) f = startN;
    return [f, t];
  }

  function groupRows(from, to, by) {
    var r = clamp(from, to), rows = dayRows(r[0], r[1]);
    var closed = rows.filter(function (x) { return !x.today; });
    var list;
    if (by === "day") {
      list = rows.map(function (x) { var s = summarize(x.day, dayLabel(x.n), [x]); s.partial = x.today; return s; });
    } else {
      var buckets = {}, order = [];
      closed.forEach(function (x) {
        var key = by === "week" ? String(monday(x.n)) : x.day.slice(0, 7);
        if (!buckets[key]) { buckets[key] = []; order.push(key); }
        buckets[key].push(x);
      });
      list = order.sort().map(function (key) {
        var b = buckets[key], label;
        if (by === "week") {
          var mon = Number(key), first = b[0].n, last = b[b.length - 1].n;
          label = shortDay(first) + "–" + shortDay(last) + (first !== mon || last !== mon + 6 ? " (część tygodnia)" : "");
        } else {
          label = new Date(b[0].n * MS).toLocaleDateString("pl-PL", { month: "long", year: "numeric", timeZone: "UTC" });
        }
        return summarize(key, label, b);
      });
    }
    var low = closed.filter(function (x) { return x.trCov !== null && x.trCov < LOW; }).length;
    return {
      from: str(r[0]), to: str(r[1]), rows: list,
      total: closed.length ? summarize("all", "Cały wybrany okres", closed) : null,
      closedDays: closed.length, lowCoverageDays: low
    };
  }

  function models(from, to) {
    var r = clamp(from, to);
    var seen = dayRows(r[0], r[1]).filter(function (x) { return x.trHas; });
    var closedRows = seen.filter(function (x) { return !x.today; });
    var rows = closedRows.length ? closedRows : seen;
    var by = {};
    function get(name, meta) {
      if (!by[name]) by[name] = { model: name, kind: meta ? meta.kind : "", electric: meta ? meta.electric : false, cars: 0, orders: 0, carDays: 0 };
      return by[name];
    }
    rows.forEach(function (row) {
      var tr = trByDay[row.day];
      Object.keys(tr.by_model).forEach(function (m) { get(m).orders += tr.by_model[m]; });
      cars.forEach(function (c) { if (inFleet(c, row.n)) get(c.model, c).carDays++; });
    });
    if (rows.length) {
      var last = rows[rows.length - 1];
      cars.forEach(function (c) { if (inFleet(c, last.n)) get(c.model, c).cars++; });
    }
    var totalOrders = 0, totalCars = 0, totalCarDays = 0;
    Object.keys(by).forEach(function (k) { totalOrders += by[k].orders; totalCars += by[k].cars; totalCarDays += by[k].carDays; });
    var days = rows.length;
    var list = Object.keys(by).map(function (k) {
      var m = by[k];
      m.share = totalOrders ? m.orders / totalOrders : null;
      m.perDay = days ? m.orders / days : null;
      m.perCarDay = m.carDays ? m.orders / m.carDays : null;
      return m;
    }).sort(function (a, b) { return b.orders - a.orders || b.cars - a.cars || a.model.localeCompare(b.model, "pl"); });
    var total = list.length ? {
      model: "Razem", kind: "", electric: false, cars: totalCars, orders: totalOrders,
      share: totalOrders ? 1 : null, perDay: days ? totalOrders / days : null,
      perCarDay: totalCarDays ? totalOrders / totalCarDays : null
    } : null;
    return { from: str(r[0]), to: str(r[1]), rows: list, total: total, closedDays: closedRows.length, days: days };
  }

  function presets() {
    var t = num(D.today), d = new Date(t * MS);
    var monthStart = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / MS;
    var prevStart = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() - 1, 1) / MS;
    var first = D.start || D.today;
    function from(x) { return D.start && x < D.start ? D.start : x; }
    return [
      { id: "7", label: "7 dni", from: from(str(t - 6)), to: D.today },
      { id: "14", label: "14 dni", from: from(str(t - 13)), to: D.today },
      { id: "30", label: "30 dni", from: from(str(t - 29)), to: D.today },
      { id: "month", label: "Ten miesiąc", from: from(str(monthStart)), to: D.today },
      { id: "prev", label: "Poprzedni miesiąc", from: from(str(prevStart)), to: str(monthStart - 1) },
      { id: "all", label: "Od początku danych", from: first, to: D.today }
    ];
  }

  return { groupRows: groupRows, models: models, presets: presets, LOW: LOW };
}
</script>

<script>
(function () {
  var D = JSON.parse(document.getElementById("data").textContent);
  var calc = createCalc(D);
  var presets = calc.presets();
  var BY = [["day", "Dzień po dniu"], ["week", "Tygodnie"], ["month", "Miesiące"]];
  var SECTIONS = ["fleet", "orders", "models"];

  var initial = presets.filter(function (p) { return p.id === "14"; })[0];
  var state = { global: { preset: "14", from: initial.from, to: initial.to, by: "day" } };
  SECTIONS.forEach(function (id) { state[id] = { preset: "14", from: initial.from, to: initial.to, by: "day" }; });

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(v, digits) {
    if (v === null || v === undefined) return "—";
    return v.toLocaleString("pl-PL", { minimumFractionDigits: digits, maximumFractionDigits: digits });
  }
  function pct(v) { return v === null ? "—" : fmt(v, 1) + "%"; }
  function pctOf(a, b) { return a === null || b === null || b === 0 ? "—" : pct(a / b * 100); }
  function day(s) { var p = s.split("-"); return p[2] + "." + p[1] + "." + p[0]; }

  function picker(scope, withBy) {
    var st = state[scope], pre = scope === "global" ? "Okres dla wszystkich tabel" : "Okres tej tabeli";
    var html = '<div class="label">' + pre + "</div><div class=\"row\">";
    presets.forEach(function (p) {
      html += '<button class="chip' + (st.preset === p.id ? " on" : "") + '" data-scope="' + scope + '" data-preset="' + p.id + '">' + p.label + "</button>";
    });
    html += '</div><div class="row"><label class="date">Od<input type="date" data-scope="' + scope + '" data-edge="from" value="' + st.from + '" min="' + (D.start || "") + '" max="' + D.today + '"></label>' +
      '<label class="date">Do<input type="date" data-scope="' + scope + '" data-edge="to" value="' + st.to + '" min="' + (D.start || "") + '" max="' + D.today + '"></label></div>';
    if (withBy) {
      html += '<div class="row"><span class="small muted" style="align-self:center;margin-right:4px">Pokaż jako</span>';
      BY.forEach(function (b) {
        html += '<button class="chip' + (st.by === b[0] ? " on" : "") + '" data-scope="' + scope + '" data-by="' + b[0] + '">' + b[1] + "</button>";
      });
      html += "</div>";
    }
    return html;
  }

  function rangeNote(r) {
    if (r.from > r.to) return '<p class="muted small">W tym okresie nie ma dni, które da się porównać. Zestawienia zaczynają się od ' + day(D.start) + ".</p>";
    if (!r.closedDays) return '<p class="muted small">Pokazuję ' + day(r.from) + " – " + day(r.to) + ". Nie ma jeszcze zakończonej doby, więc widać tylko dzisiejszy, trwający dzień. Podsumowanie okresu pojawi się po północy.</p>";
    var text = "Pokazuję " + day(r.from) + " – " + day(r.to) + ".";
    if (r.lowCoverageDays > 0) {
      text += " " + r.lowCoverageDays + " z " + r.closedDays + " zakończonych dni ma pokrycie odczytów mapy poniżej " + calc.LOW + "%, więc dane Trafficara z tych dni są niedoszacowane.";
    }
    return '<p class="muted small">' + text + "</p>";
  }

  function label(row) { return esc(row.label) + (row.partial ? '<span class="badge">trwa</span>' : ""); }
  function cov(v) { return v === null ? "—" : '<span class="' + (v < calc.LOW ? "warn" : "") + '">' + pct(v) + "</span>"; }

  function boltFleetNote() {
    var text = "Flota Bolta to stała liczba 490 aut, przyjęta na sztywno. Dni przed pierwszym zamówieniem w arkuszu pokazują „—”.";
    return '<p class="muted small" style="margin-top:12px;max-width:760px">' + esc(text) + "</p>";
  }

  function shell(id, title, hint, withBy, body) {
    return "<h2>" + title + '</h2><p class="muted hint">' + hint + '</p><div class="picker">' + picker(id, withBy) + "</div>" +
      '<div class="notes">' + body.note + "</div>" + body.table;
  }

  function fleetBody() {
    var r = calc.groupRows(state.fleet.from, state.fleet.to, state.fleet.by);
    function tr(row, strong) {
      return '<tr class="' + (strong ? "strong" : "") + '"><td>' + label(row) + '</td><td class="n sep">' + fmt(row.trFleet, 1) +
        '</td><td class="n">' + fmt(row.trFree, 1) + '</td><td class="n">' + cov(row.trCov) +
        '</td><td class="n sep">' + fmt(row.boltFleet, 1) + '</td><td class="n sep">' + pctOf(row.boltFleet, row.trFleet) + "</td></tr>";
    }
    var rows = (r.total ? tr(r.total, true) : "") + r.rows.map(function (x) { return tr(x, false); }).join("");
    var table = '<div class="table-wrap"><table><thead><tr><th rowspan="2">Okres</th><th class="c sep" colspan="3">Trafficar</th><th class="c sep">Bolt</th>' +
      '<th rowspan="2" class="sep">Flota Bolta jako % Trafficara</th></tr><tr><th class="sep">Flota</th><th>Śr. wolnych na mapie</th><th>Pokrycie mapy</th><th class="sep">Flota</th></tr></thead><tbody>' +
      rows + "</tbody></table>" + (r.rows.length ? "" : '<div class="empty">W tym okresie nie ma jeszcze zakończonej doby.</div>') + "</div>";
    return { note: rangeNote(r) + boltFleetNote(), table: table };
  }

  function ordersBody() {
    var by = state.orders.by, perPeriod = by !== "day";
    var r = calc.groupRows(state.orders.from, state.orders.to, by);
    function tr(row, strong) {
      return '<tr class="' + (strong ? "strong" : "") + '"><td>' + label(row) + '</td><td class="n sep">' + (row.trDays ? fmt(row.trOrders, 0) : "—") +
        '</td><td class="n">' + fmt(row.trFleet, 1) + "</td>" + (perPeriod ? '<td class="n">' + fmt(row.trPerCar, 2) + "</td>" : "") +
        '<td class="n">' + fmt(row.trPerCarDay, 2) + '</td><td class="n sep">' + (row.boltDays ? fmt(row.boltOrders, 0) : "—") +
        '</td><td class="n">' + fmt(row.boltFleet, 1) + "</td>" + (perPeriod ? '<td class="n">' + fmt(row.boltPerCar, 2) + "</td>" : "") +
        '<td class="n">' + fmt(row.boltPerCarDay, 2) + '</td><td class="n sep">' + (row.partial ? "—" : pctOf(row.boltPerDay, row.trPerDay)) + "</td></tr>";
    }
    var span = perPeriod ? 4 : 3;
    var rows = (r.total ? tr(r.total, true) : "") + r.rows.map(function (x) { return tr(x, false); }).join("");
    var table = '<div class="table-wrap"><table style="min-width:860px"><thead><tr><th rowspan="2">Okres</th><th class="c sep" colspan="' + span + '">Trafficar</th>' +
      '<th class="c sep" colspan="' + span + '">Bolt</th><th rowspan="2" class="sep">Bolt jako % Trafficara</th></tr><tr>' +
      '<th class="sep">Zamówień</th><th>Flota</th>' + (perPeriod ? "<th>Na auto</th>" : "") + "<th>Na auto na dobę</th>" +
      '<th class="sep">Zamówień</th><th>Flota</th>' + (perPeriod ? "<th>Na auto</th>" : "") + "<th>Na auto na dobę</th></tr></thead><tbody>" +
      rows + "</tbody></table>" + (r.rows.length ? "" : '<div class="empty">W tym okresie nie ma jeszcze zakończonej doby.</div>') + "</div>";
    return { note: rangeNote(r), table: table };
  }

  function modelsBody() {
    var r = calc.models(state.models.from, state.models.to);
    function tr(m, strong) {
      return '<tr class="' + (strong ? "strong" : "") + '"><td>' + esc(m.model) + (m.electric ? '<span class="badge">elektryczny</span>' : "") +
        "</td><td>" + esc(m.kind) + '</td><td class="n">' + fmt(m.cars, 0) + '</td><td class="n">' + fmt(m.orders, 0) + '</td><td class="n">' +
        (m.share === null ? "—" : pct(m.share * 100)) + '</td><td class="n">' + fmt(m.perDay, 1) + '</td><td class="n">' + fmt(m.perCarDay, 2) + "</td></tr>";
    }
    var body = r.rows.map(function (m) { return tr(m, false); }).join("") + (r.total ? tr(r.total, true) : "");
    var table = r.rows.length
      ? '<div class="table-wrap"><table style="min-width:760px"><thead><tr><th>Model</th><th>Rodzaj</th><th>Aut we flocie</th><th>Zamówień w okresie</th><th>Udział w zamówieniach</th><th>Zamówień na dobę</th><th>Na auto na dobę</th></tr></thead><tbody>' + body + "</tbody></table></div>"
      : '<div class="table-wrap"><div class="empty">W tym okresie nie ma jeszcze zakończonej doby z odczytami.</div></div>';
    var basis = r.closedDays ? "Liczone z " + r.closedDays + " zakończonych dób z odczytami." : "Liczone z dzisiejszego, trwającego dnia; od jutra tylko z zakończonych dób.";
    return { note: r.from > r.to ? rangeNote(r) : '<p class="muted small">Pokazuję ' + day(r.from) + " – " + day(r.to) + ". " + basis + "</p>", table: table };
  }

  var TEXT = {
    fleet: ["Wielkość floty", "Trafficar: auta carsharingowe w Warszawie, które widać na mapie danego dnia lub dobę wcześniej, oraz średnia liczba wolnych aut z odczytów. Bolt: stała flota 490 aut. Hulajnogi są pominięte.", true, fleetBody],
    orders: ["Zamówienia i zamówienia na auto", "Zamówienie Trafficara to auto, które zniknęło z mapy i pojawiło się ponownie co najmniej 5 minut później w innym miejscu (co najmniej 300 m dalej). Nic innego się nie liczy. Bolt to wszystkie zamówienia z arkusza rozpoczęte danego dnia, także trwające, bez anulowanych i nieudanych płatności. Na auto to zamówienia podzielone przez flotę z tego samego okresu.", true, ordersBody],
    models: ["Zamówienia Trafficara według modelu", "Podział przejazdów Trafficara na modele aut, liczony z zakończonych dób wybranego okresu. Aut we flocie to stan z ostatniej doby okresu, a „na auto na dobę” uwzględnia, od kiedy dane auto jest we flocie.", false, modelsBody]
  };

  function renderSection(id) {
    var t = TEXT[id];
    document.getElementById(id).innerHTML = shell(id, t[0], t[1], t[2], t[3]());
  }
  function renderAll() {
    document.getElementById("global").innerHTML = picker("global", true);
    SECTIONS.forEach(renderSection);
  }

  function apply(scope, patch) {
    var targets = scope === "global" ? ["global"].concat(SECTIONS) : [scope];
    targets.forEach(function (t) { Object.keys(patch).forEach(function (k) { state[t][k] = patch[k]; }); });
    if (scope === "global") renderAll(); else renderSection(scope);
  }

  document.addEventListener("click", function (e) {
    var el = e.target.closest("button.chip");
    if (!el) return;
    var scope = el.dataset.scope;
    if (el.dataset.preset) {
      var p = presets.filter(function (x) { return x.id === el.dataset.preset; })[0];
      apply(scope, { preset: p.id, from: p.from, to: p.to });
    } else if (el.dataset.by) {
      apply(scope, { by: el.dataset.by });
    }
  });
  document.addEventListener("change", function (e) {
    var el = e.target;
    if (!el.dataset || !el.dataset.edge || !el.value) return;
    var st = state[el.dataset.scope], from = st.from, to = st.to;
    if (el.dataset.edge === "from") from = el.value; else to = el.value;
    if (from > to) { var tmp = from; from = to; to = tmp; }
    var match = presets.filter(function (x) { return x.from === from && x.to === to; })[0];
    apply(el.dataset.scope, { preset: match ? match.id : null, from: from, to: to });
  });

  function clock(iso) { return iso ? new Date(iso).toLocaleTimeString("pl-PL", { timeZone: "Europe/Warsaw", hour: "2-digit", minute: "2-digit" }) : "—"; }
  function sheetClock(s) {
    var m = /(\d{1,2}):(\d{2}):\d{2}$/.exec(s || "");
    return m ? m[1].padStart(2, "0") + ":" + m[2] : "—";
  }
  var generated = new Date(D.generated_at).toLocaleString("pl-PL", { timeZone: "Europe/Warsaw", dateStyle: "medium", timeStyle: "short" });
  var countFrom = D.count_from ? new Date(D.count_from).toLocaleString("pl-PL", { timeZone: "Europe/Warsaw", dateStyle: "medium", timeStyle: "short" }) : null;
  document.getElementById("meta").textContent = "Stan na " + generated +
    (countFrom ? ". Zamówienia obu firm liczone od " + countFrom + ": od tej chwili odczyty Trafficara idą bez przerw i według obecnej reguły. Wcześniejsze zamówienia są pominięte." : ".") +
    " Dzisiejszy wiersz rośnie na bieżąco: Trafficar do " + clock(D.traficar_until) + ", Bolt do " + sheetClock(D.bolt_latest_order) +
    " (arkusz odświeża się co godzinę). Strona sama się przeładowuje co 5 minut.";
  setTimeout(function () { location.reload(); }, 5 * 60 * 1000);
  var sources = [];
  if (D.bolt_orders_fetched_at) sources.push("Arkusz zamówień Bolta odczytany " + new Date(D.bolt_orders_fetched_at).toLocaleString("pl-PL", { timeZone: "Europe/Warsaw", dateStyle: "medium", timeStyle: "short" }) + ".");
  if (D.bolt_latest_order) sources.push("Ostatnie zamówienie w arkuszu: " + D.bolt_latest_order + ".");
  if (D.errors && D.errors.orders) sources.push("Ostatni błąd odczytu arkusza: " + D.errors.orders + ".");
  document.getElementById("sources").textContent = sources.join(" ");
  renderAll();
})();
</script>
</body>
</html>
