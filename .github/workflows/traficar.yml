name: Traficar Warszawa

on:
  schedule:
    # GitHub may start these late or skip some. Each run reads for ~5h45m and the
    # concurrency group queues the next one, so it takes over as soon as this one ends.
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: traficar-collector
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # A scheduled run is handed the commit that was newest when it was queued, which is
      # hours old by the time it starts. Checking out the branch by name gets the tip now,
      # so the run's own pushes rebase cleanly instead of conflicting and being lost.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git
        run: |
          git config user.name "traficar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # A failing test must not stop the map reads: that gap would cost hours of data.
      - name: Test detection
        continue-on-error: true
        run: python -m unittest test_collector test_report

      - name: Read the map every minute
        run: python traficar_collector.py --minutes 345 --git
